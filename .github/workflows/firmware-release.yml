name: Firmware Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run host unit tests
        run: make -C test/host

      - name: Build firmware for ESP32
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          command: idf.py -B build-esp32 -DSDKCONFIG=build-esp32/sdkconfig -DIDF_TARGET=esp32 build

      - name: Build firmware for ESP32-C3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c3
          command: idf.py -B build-esp32c3 -DSDKCONFIG=build-esp32c3/sdkconfig -DIDF_TARGET=esp32c3 build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install esptool
        run: pip install "esptool>=5,<6"

      - name: Package release assets, manifest and release notes
        run: tools/make_release.sh "${GITHUB_REF_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
